<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register · WaliJomok</title><link rel="stylesheet" href="../style.css"><style>.box{max-width:380px;margin:15vh auto;padding:25px;background:#0d0d0d;border:1px solid #222;border-radius:12px}.box input,.box button{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border-radius:7px}.box input{background:#050505;color:#fff;border:1px solid #333}.box button{background:#fff;border:0;font-weight:700}</style></head><body><div class="box"><h2>REGISTER</h2><input id="user" placeholder="Username"><input id="name" placeholder="Display name (opsional)"><input id="pass" type="password" placeholder="Password"><input id="confirm" type="password" placeholder="Konfirmasi password"><button id="go">DAFTAR</button><p id="err" style="color:#f77;font-size:.8rem"></p></div><script>document.getElementById('go').onclick=async()=>{const username=user.value.trim(),displayname=name.value.trim(),password=pass.value,confirmPass=confirm.value;if(!username||!password||password!==confirmPass){err.textContent='Data tidak lengkap atau password tidak cocok.';return}const r=await fetch('/api/community/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password,displayname})});const d=await r.json();if(d.success){localStorage.setItem('walijomok_user',JSON.stringify(d.user));location.href='../home.html'}else err.textContent=d.message}</script></body></html>
