<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · WaliJomok</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050505;color:#fff}
        .login-box{width:min(92%,380px);padding:28px;background:#0d0d0d;border:1px solid rgba(255,255,255,.09);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
        .login-logo{display:block;width:64px;height:64px;object-fit:contain;margin:0 auto 16px}
        .login-title{text-align:center;font-size:1.45rem;margin-bottom:5px}.login-sub{text-align:center;color:rgba(255,255,255,.45);font-size:.82rem;margin-bottom:22px}
        .login-input{display:block;width:100%;box-sizing:border-box;padding:12px 13px;margin:10px 0;background:#050505;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:9px;outline:none}
        .login-input:focus{border-color:rgba(255,255,255,.3)}.login-btn{width:100%;padding:12px;border:0;border-radius:9px;background:#fff;color:#000;font-weight:700;cursor:pointer;margin-top:6px}
        .login-error{display:none;color:#ff7070;font-size:.8rem;margin:10px 0}.login-note{text-align:center;color:rgba(255,255,255,.35);font-size:.72rem;margin-top:18px}
    </style>
</head>
<body>
    <div class="login-box">
        <img src="assets/logo-wj.png" class="login-logo" alt="WJ">
        <h1 class="login-title">WaliJomok</h1>
        <div class="login-sub">Community Login</div>
        <div id="loginError" class="login-error"></div>
        <input id="loginUser" class="login-input" type="text" placeholder="Username" autocomplete="username">
        <input id="loginPass" class="login-input" type="password" placeholder="Password" autocomplete="current-password">
        <button id="btnLogin" class="login-btn">LOGIN</button>
        <div class="login-note">Akses website hanya untuk member WaliJomok.</div>
    </div>
    <script>
        const saved = localStorage.getItem('walijomok_user');
        if (saved) window.location.replace('home.html');
        async function login(){
            const username=document.getElementById('loginUser').value.trim();
            const password=document.getElementById('loginPass').value;
            const err=document.getElementById('loginError');
            err.style.display='none';
            if(!username||!password){err.textContent='Username dan password wajib diisi.';err.style.display='block';return;}
            try{
                const res=await fetch('/api/community/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
                const data=await res.json();
                if(!data.success){err.textContent=data.message||'Login gagal.';err.style.display='block';return;}
                localStorage.setItem('walijomok_user',JSON.stringify(data.user));
                window.location.replace('home.html');
            }catch(e){err.textContent='Server tidak dapat dihubungi.';err.style.display='block';}
        }
        document.getElementById('btnLogin').onclick=login;
        document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
    </script>
</body>
</html>
